services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_MAX_THREADS: "5"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      FORCE_SSL: "${FORCE_SSL:-false}"
    entrypoint: ["sh", "/rails/bin/compose-entrypoint"]
    volumes:
      - task_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  task_storage: